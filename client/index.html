<!DOCTYPE html>
<html lang="en" style="background:#ffffff">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- PRELOAD THE BODY FACE — this is what stops the font swapping in after the page has drawn.
         Playfair Display is the default body font (index.css `body`) and the face the landing page
         and Trade Sync both use. It was reaching the browser only via `@import '@fontsource-...'`
         inside the CSS bundle, so the chain was: HTML -> CSS file -> parse -> discover @font-face ->
         fetch woff2. Text painted in Georgia meanwhile and swapped when the font finally landed.
         Preloading starts that fetch during HTML parse, in parallel with the CSS and JS.
         One VARIABLE file covers every weight (38 KB), so this costs a single request.
         `crossorigin` is REQUIRED even same-origin: fonts are fetched in CORS mode, and without it
         the browser downloads the file TWICE and the preload does nothing. -->
    <link rel="preload" href="/fonts/playfair-display-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PRELOAD THE LOGO — the same problem as the font above, and it had the same cause.
         The logo is an <img> inside a React component, so nothing could request it until the JS
         bundle had been fetched, parsed and executed and React had rendered. Measured 2026-08-21:
         the request began AFTER DOMContentLoaded, which is why the header text and nav appeared
         first and the mark arrived afterwards, on the landing page and the dashboard alike.
         Preloading starts that fetch during HTML parse, in parallel with the CSS and JS, so by the
         time React renders it is already in cache and paints in the same frame as the rest.
         (The file itself was also 403 KB for a 116x50 render — now a 19 KB WebP. See Wordmark.tsx.)

         ONE VARIANT, NOT BOTH. There is a light and a reversed logo, and preloading both would waste
         a download and make the browser warn about an unused preload. This picks the one the stored
         theme actually calls for. Two different keys because the two surfaces keep their theme
         separately: `pub-theme` for the public pages (App.tsx) and `journal_dark_mode` for the
         dashboard (Journal.tsx). Wrapped in try/catch because localStorage throws outright in some
         privacy modes, and a logo preload must never be the thing that stops the page booting.
         Worst case it guesses wrong and costs one extra 19 KB fetch. -->
    <script>
      (function () {
        var dark = false;
        try {
          if (location.pathname.indexOf('/journal') === 0) {
            // THE DASHBOARD DEFAULTS TO DARK when never toggled (Journal.tsx: `?? true`), so an
            // absent key means dark here, not light. Getting this backwards would mispredict every
            // first-ever dashboard load.
            var j = localStorage.getItem('journal_dark_mode');
            dark = j === null ? true : j === 'true';
          } else {
            dark = localStorage.getItem('pub-theme') === '1';   // public pages default to LIGHT
          }
        } catch (e) {}
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/webp';
        l.href = dark ? '/logo-dark.webp' : '/logo.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>

    <!-- Primary SEO -->
    <title>Trade&amp;Journal – Professional Trading Journal for Forex, Crypto &amp; Commodities</title>
    <meta name="description" content="The professional trading journal built for serious traders. Log trades, track psychology, analyze drawdown, and unlock your edge with AI-powered analytics. Free forever plan available." />
    <meta name="keywords" content="trading journal, forex journal, crypto trading log, trade tracker, trading analytics, drawdown analysis, strategy audit, AI trading coach, MT4 journal, MT5 journal, SMC trading, copy trading" />
    <meta name="author" content="Trade&amp;Journal" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Trade&amp;Journal" />
    <meta property="og:title" content="Trade&amp;Journal – Professional Trading Journal" />
    <meta property="og:description" content="Log trades, track psychology, analyze drawdown, and unlock your edge with AI-powered analytics. Free forever plan available." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradeandjournal.com" />
    <meta property="og:image" content="https://tradeandjournal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tradeandjournal" />
    <meta name="twitter:title" content="Trade&amp;Journal – Professional Trading Journal" />
    <meta name="twitter:description" content="Log trades, track psychology, and unlock your edge with AI-powered analytics." />
    <meta name="twitter:image" content="https://tradeandjournal.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts loaded via Fontsource (self-hosted npm packages, no Google Fonts request) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
