<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- PRELOAD THE BODY FACE — this is what stops the font swapping in after the page has drawn.
         Playfair Display is the default body font (index.css `body`) and the face the landing page
         and Trade Sync both use. It was reaching the browser only via `@import '@fontsource-...'`
         inside the CSS bundle, so the chain was: HTML -> CSS file -> parse -> discover @font-face ->
         fetch woff2. Text painted in Georgia meanwhile and swapped when the font finally landed.
         Preloading starts that fetch during HTML parse, in parallel with the CSS and JS.
         One VARIABLE file covers every weight (38 KB), so this costs a single request.
         `crossorigin` is REQUIRED even same-origin: fonts are fetched in CORS mode, and without it
         the browser downloads the file TWICE and the preload does nothing. -->
    <link rel="preload" href="/fonts/playfair-display-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- PRELOAD THE LOGO — an <img> inside a React component cannot be requested until the JS
         bundle has been fetched, parsed and executed and React has rendered. Measured 2026-08-21:
         the request began AFTER DOMContentLoaded, which is why the nav appeared first and the mark
         arrived afterwards. Preloading starts the fetch during HTML parse, in parallel with the CSS
         and JS, so it is already in cache when React renders and paints in the same frame.

         A PLAIN LINK, NOT A SCRIPT (2026-08-30). This used to be 25 lines of JavaScript reading two
         different theme keys from localStorage to guess whether to fetch the light or the reversed
         logo. The mark carries its own ground, so ONE file serves both surfaces — the guess, the two
         keys, the try/catch for privacy modes and the risk of guessing wrong all go away, and a
         static link starts the fetch earlier than a script ever could.

         THE FILES CHANGED 2026-08-31: `logo-lockup*.webp` is the mark AND the name in one image, so
         the name is no longer set as live text beside it. Cropped from a 599 KB JPEG whose artwork
         occupied the middle third.

         BOTH VARIANTS ARE PRELOADED, and that is cheaper than it looks. The theme is not knowable
         here without reading localStorage in a blocking script — which is the 25 lines this block
         used to be, and which could still guess wrong. Two files at ~25 KB each is a smaller cost
         than a blocking script, and far smaller than showing the wrong one. Keep this in step with
         `components/Wordmark.tsx` — a preload of a file nothing renders is pure waste, and a render
         with no preload is the late logo this block exists to prevent. -->
    <link rel="preload" href="/logo-lockup.webp?v=ab3f57a8" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="/logo-lockup-dark.webp?v=ab3f57a8" as="image" type="image/webp" fetchpriority="high" />

    <!-- Primary SEO -->
    <title>DailyTradeBook – Professional Trading Journal for Forex, Crypto &amp; Commodities</title>
    <meta name="description" content="The professional trading journal built for serious traders. Log trades, track psychology, analyze drawdown, and unlock your edge with AI-powered analytics. Free forever plan available." />
    <meta name="keywords" content="trading journal, forex journal, crypto trading log, trade tracker, trading analytics, drawdown analysis, strategy audit, AI trading coach, MT4 journal, MT5 journal, SMC trading, copy trading" />
    <meta name="author" content="DailyTradeBook" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="DailyTradeBook" />
    <meta property="og:title" content="DailyTradeBook – Professional Trading Journal" />
    <meta property="og:description" content="Log trades, track psychology, analyze drawdown, and unlock your edge with AI-powered analytics. Free forever plan available." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradeandjournal.com" />
    <meta property="og:image" content="https://tradeandjournal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tradeandjournal" />
    <meta name="twitter:title" content="DailyTradeBook – Professional Trading Journal" />
    <meta name="twitter:description" content="Log trades, track psychology, and unlock your edge with AI-powered analytics." />
    <meta name="twitter:image" content="https://tradeandjournal.com/og-image.png" />

    <!-- Favicon -->
    <!-- THE TAB ICON IS CUT FROM THE LOGO ITSELF, so the tab and the header can never disagree
         about what this product's mark is. It used to be a hand-drawn navy square with a green
         arrow — a different symbol entirely. `favicon.png` is now the pen-nib mark sliced out of
         the supplied artwork by scripts/build_logo.py, on a rounded tile in the artwork's own ink
         (a bare dark mark vanishes in a dark tab strip, which is the problem that started this). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=ab3f57a8" />
    <link rel="apple-touch-icon" href="/favicon.png?v=ab3f57a8" />

    <!-- Fonts loaded via Fontsource (self-hosted npm packages, no Google Fonts request) -->
  </head>
  <body>
    <!--
      THE FIRST PAINT, BEFORE ANY JAVASCRIPT RUNS.

      His report, 2026-10-10: *"fix skeletones in other pages where the skeleton does not look like
      that page. One of such pages is the landing page."* On the landing page the honest answer was
      worse than a mismatched skeleton — there was NO skeleton. HomePage is imported eagerly
      (App.tsx:29), so React's Suspense placeholder never fires for "/", and nothing at all paints
      until the main bundle parses.

      MEASURED on the built site at 400 kbps: rootKids 0, textLen 0 for the whole sample —
      OVER EIGHT SECONDS OF WHITE on the most important page on the site.

      This is plain HTML and CSS in the document, so the browser paints it while the bundle is still
      downloading. It mirrors HomeHero: badge, two headline lines, one supporting line, two buttons,
      six feature chips, then the 2.6:1 showcase panel. main.tsx removes it the moment React mounts.

      ⚠ KEEP IT IN STEP WITH HomeHero. If the hero's shape changes and this does not, the page will
      visibly jump as it swaps — which is the exact complaint this is answering.
    -->
    <div id="boot-skeleton" aria-hidden="true">
      <div class="bs-wrap">
        <div class="bs b-pill"></div>
        <div class="bs b-h1"></div>
        <div class="bs b-h2"></div>
        <div class="bs b-sub"></div>
        <div class="bs-row">
          <div class="bs b-btn"></div><div class="bs b-btn2"></div>
        </div>
        <div class="bs-chips">
          <i class="bs"></i><i class="bs"></i><i class="bs"></i>
          <i class="bs"></i><i class="bs"></i><i class="bs"></i>
        </div>
        <div class="bs b-panel"></div>
      </div>
    </div>
    <!--
      THE JOURNAL'S OWN FIRST PAINT (added 2026-10-13).

      His report: *"When I reload the page after it has stayed inactive for a while, the skeleton
      for that reload is ugly and does not represent the page being reloaded."* "After inactivity"
      is the whole clue: a quick reload comes from the browser's memory cache and the gap is
      invisible; once that cache is dropped the reload is COLD and the gap is seconds long.

      MEASURED on the live site at 500 kbps with the cache cleared: from 5.6s to 7.6s there was
      NOTHING on screen — no text, no elements in #root — on a WHITE page, and then a hard snap to
      the journal's near-black ground. Seven and a half seconds of white claiming to be a dark app.

      Two lines caused it: `<html style="background:#ffffff">` above, and the script below removing
      the hero placeholder on every path that is not "/". That removal was RIGHT — drawing a landing
      hero over the journal is the same mismatch in the other direction. The answer is not to keep
      the hero, it is to give the journal its own, which is this block.

      ⚠ THESE NUMBERS ARE A COPY and index.html cannot import the original. The source of truth is
      `client/src/components/skeletons/AppShellSkeleton.tsx` / `JournalShellSkeleton.tsx`, measured
      against the real dashboard: a 32px price strip over a 60px nav, a 185px rail, six tiles 80
      tall at a 4px gap, then a 7fr/5fr split. Deliberately COARSE — no tile internals — so there is
      as little as possible that can drift out of step with the page.
    -->
    <div id="boot-journal" aria-hidden="true">
      <div class="bj-top"></div>
      <div class="bj-nav"></div>
      <div class="bj-body">
        <div class="bj-rail">
          <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div><div></div><div></div>
        </div>
        <div class="bj-main">
          <div class="bj-kpi">
            <div></div><div></div><div></div><div></div><div></div><div></div>
          </div>
          <div class="bj-split"><div></div><div></div></div>
        </div>
      </div>
    </div>
    <style>
      /* The hero's own pale ground, so the swap to the real page is not a flash of a different
         colour. The dark variant follows the saved public theme, applied by the script below. */
      #boot-skeleton { position: fixed; inset: 0; background: #f0f5ff; z-index: 1; overflow: hidden; }
      #boot-skeleton.bs-dark { background: #020817; }
      .bs-wrap { max-width: 1280px; margin: 0 auto; padding: 150px 32px 0; text-align: center; }
      .bs, .bs-chips i { display: block; border-radius: 10px; background: rgba(15,23,42,.07);
                         animation: bsPulse 1.5s ease-in-out infinite; }
      .bs-dark .bs, .bs-dark .bs-chips i { background: rgba(255,255,255,.07); }
      @keyframes bsPulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      .b-pill  { width: 240px; height: 30px; border-radius: 999px; margin: 0 auto; }
      .b-h1    { width: 62%;  height: 54px; border-radius: 12px; margin: 28px auto 0; }
      .b-h2    { width: 48%;  height: 54px; border-radius: 12px; margin: 14px auto 0; }
      .b-sub   { width: 420px; max-width: 80%; height: 16px; margin: 24px auto 0; }
      .bs-row  { display: flex; gap: 12px; justify-content: center; margin-top: 30px; }
      .b-btn   { width: 168px; height: 48px; border-radius: 12px; }
      .b-btn2  { width: 150px; height: 48px; border-radius: 12px; }
      .bs-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                  gap: 10px; margin-top: 44px; }
      .bs-chips i { height: 56px; border-radius: 12px; }
      .b-panel { width: 100%; aspect-ratio: 2.6 / 1; border-radius: 22px; margin-top: 56px; }
      @media (max-width: 640px) { .bs-wrap { padding-top: 120px; } .b-h1, .b-h2 { width: 86%; height: 40px; } }
      @media (prefers-reduced-motion: reduce) { .bs, .bs-chips i { animation: none } }

      /* ── the journal outline. Hidden by default; the script below shows it only on /journal. ── */
      #boot-journal { position: fixed; inset: 0; z-index: 1; display: none; overflow: hidden; }
      .bj-top { height: 32px; background: rgba(255,255,255,.03); }
      .bj-nav { height: 60px; background: rgba(255,255,255,.05);
                border-bottom: 1px solid rgba(255,255,255,.06); }
      .bj-body { display: flex; height: calc(100% - 92px); }
      .bj-rail { width: 185px; min-width: 185px; padding: 14px 12px; display: flex;
                 flex-direction: column; gap: 11px; background: rgba(255,255,255,.04); }
      .bj-rail > div { height: 16px; border-radius: 8px; background: rgba(255,255,255,.07);
                       animation: bsPulse 1.5s ease-in-out infinite; }
      .bj-main { flex: 1; min-width: 0; padding: 14px 16px; display: flex;
                 flex-direction: column; gap: 6px; }
      .bj-kpi { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px; }
      .bj-kpi > div { height: 80px; border-radius: 8px; background: rgba(255,255,255,.05);
                      border: 1px solid rgba(255,255,255,.08);
                      animation: bsPulse 1.5s ease-in-out infinite; }
      .bj-split { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; }
      .bj-split > div { height: 302px; border-radius: 8px; background: rgba(255,255,255,.05);
                        border: 1px solid rgba(255,255,255,.08);
                        animation: bsPulse 1.5s ease-in-out infinite; }
      /* The journal's OWN breakpoints (AppShellSkeleton BONE_CSS): 2/3/6 tiles at 768 and 1024,
         the split at 1024, and the rail hidden under 768 exactly as Journal.tsx hides it. */
      @media (max-width: 767px) { .bj-rail { display: none; } }
      @media (min-width: 768px) { .bj-kpi { grid-template-columns: repeat(3, minmax(0,1fr)); } }
      @media (min-width: 1024px) {
        .bj-kpi { grid-template-columns: repeat(6, minmax(0,1fr)); }
        .bj-split { grid-template-columns: 7fr 5fr; }
      }
      /* The Light journal theme is a pale page, so its bones are dark ink, not white. */
      #boot-journal.bj-light .bj-top { background: rgba(15,23,42,.03); }
      #boot-journal.bj-light .bj-nav { background: rgba(15,23,42,.05);
                                       border-bottom-color: rgba(15,23,42,.08); }
      #boot-journal.bj-light .bj-rail { background: rgba(15,23,42,.04); }
      #boot-journal.bj-light .bj-rail > div,
      #boot-journal.bj-light .bj-kpi > div,
      #boot-journal.bj-light .bj-split > div { background: rgba(15,23,42,.07);
                                               border-color: rgba(15,23,42,.10); }
    </style>
    <script>
      // WHICH PLACEHOLDER THIS PAGE GETS, decided before a line of the app has downloaded.
      //
      // Each route keeps exactly one and the other is REMOVED, never just hidden: both are
      // `position: fixed` over everything, so a leftover would cover the real page.
      (function () {
        var hero = document.getElementById('boot-skeleton');
        var jnl  = document.getElementById('boot-journal');
        var path = location.pathname;
        var isJournal = path === '/journal' || path.indexOf('/journal/') === 0;

        if (isJournal) {
          if (hero) hero.remove();

          // THE JOURNAL'S OWN GROUND, FROM THE KEY THE JOURNAL ITSELF WRITES
          // (`journal_settings_v2`, see client/src/hooks/useJournalSettings.ts). Without this the
          // page painted #ffffff for seven seconds and then snapped to near-black. The map is a
          // copy of THEMES[id].bg — six values that change about once a year; reading it here costs
          // nothing and is the half of this fix that cannot break anything.
          var GROUNDS = { navy: '#010409', midnight: '#06070F', slate: '#0B1320',
                          forest: '#070F0A', rose: '#130A0E', light: '#FFFEFB' };
          var bg = '#010409';                       // navy, the journal's own default
          try {
            var raw = localStorage.getItem('journal_settings_v2');
            if (raw) { var id = (JSON.parse(raw) || {}).theme; if (GROUNDS[id]) bg = GROUNDS[id]; }
          } catch (e) {}                            // storage throws in a private window
          document.documentElement.style.background = bg;
          document.body.style.background = bg;
          if (jnl) {
            jnl.style.background = bg;
            if (bg === GROUNDS.light) jnl.className = 'bj-light';
            jnl.style.display = 'block';
          }
        } else {
          if (jnl) jnl.remove();
          // Match the saved public theme so the placeholder is not a white flash for a dark-mode
          // visitor. Wrapped because storage can throw in a private window.
          try { if (hero && localStorage.getItem('pub-theme') === 'dark')
                  hero.classList.add('bs-dark'); } catch (e) {}
          // Only the landing page looks like the hero. Every other route has its own placeholder
          // inside the app (App.tsx PageLoading), so showing a hero shape there would be the same
          // mismatch in the other direction.
          if (path !== '/' && hero) hero.remove();
        }

        // WHEN A PLACEHOLDER WENT UP. `AfterDelay` (components/skeletons/shellBones.tsx) reads this
        // so it does NOT sit out its 400ms on a cold load: React mounting would otherwise take this
        // block down and leave a bare ground for another 400ms — a new blank gap in the middle of
        // the very wait this is here to fill.
        if (document.getElementById('boot-skeleton') || document.getElementById('boot-journal')) {
          window.__bootShownAt = Date.now();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
